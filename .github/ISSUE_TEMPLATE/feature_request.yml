name: 功能請求 (Feature Request)
description: 針對 vLLM-Demo 專案提出新功能或改進建議
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 請描述目前遇到的限制或痛點，這個功能能解決什麼問題？
      placeholder: 目前遇到的狀況是...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的行為
      description: 請描述你期望這個功能實際運作的方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考慮過其他解法或替代做法？請一併說明。
    validations:
      required: false
