# 遠端版:vLLM 推論服務跑在外部遠端主機(不由本檔管理)
# 啟動:docker compose -f docker-compose.remote.yml up -d
# 本檔管理兩個服務:gateway(OpenAI 相容代理層,容器化)、open-webui(聊天介面)。
# open-webui 預設經由 compose 內網服務名 gateway:8080 連線,不需宿主機行程。
# 若改用 scripts\start-stack.ps1 的「gateway 跑在宿主機 .venv」開發模式,腳本會自動
# 設定 WEBUI_OPENAI_BASE_URL=http://host.docker.internal:8080/v1 覆寫預設值。
name: qwen35-vllm-remote

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build:
      context: ./gateway
      target: runtime
    image: qwen35-stack/gateway:latest
    container_name: qwen35_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      LLM_BASE_URL: http://10.0.0.220:8004/v1
      # 若改回本機容器化 vllm,改用 docker-compose.gpu.yml/.cpu.yml(服務名 http://vllm:8000/v1)
      # 用獨立變數 REMOTE_MODEL_NAME,不共用 gpu/cpu 版的 MODEL_NAME(遠端主機掛的是 gemma-4-26b,非本地 Qwen3.5)
      LLM_MODEL_NAME: ${REMOTE_MODEL_NAME:-gemma-4-26b}
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_READ_TIMEOUT: ${LLM_READ_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /var/log/gateway
    volumes:
      - ./logs/gateway:/var/log/gateway         # 結構化 JSON Lines 日誌落地到宿主機
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    container_name: qwen35_openwebui
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      # 預設連 compose 內網的 gateway 容器;僅在 gateway 改跑於宿主機時才需覆寫
      # (例如 scripts\start-stack.ps1 開發模式會設 WEBUI_OPENAI_BASE_URL=http://host.docker.internal:8080/v1)
      OPENAI_API_BASE_URL: ${WEBUI_OPENAI_BASE_URL:-http://gateway:8080/v1}
      OPENAI_API_KEY: ${LLM_API_KEY:-EMPTY}
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      DEFAULT_MODELS: ${MODEL_NAME:-qwen3.5-0.8b}
      TASK_MODEL_EXTERNAL: ${MODEL_NAME:-qwen3.5-0.8b}
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"      # 覆寫成宿主機 gateway 時,原生 Linux 也能解析
    volumes:
      - open-webui-data:/app/backend/data
    deploy:
      resources:
        limits:
          cpus: "${OPEN_WEBUI_CPU_LIMIT:-2.0}"
          memory: "${OPEN_WEBUI_MEMORY_LIMIT:-2g}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    logging: *default-logging

  # 功能測試:docker compose -f docker-compose.remote.yml --profile test run --rm unit-test
  unit-test:
    profiles: ["test"]
    build:
      context: ./gateway
      target: dev
    image: qwen35-stack/gateway:dev
    command: ["pytest", "-m", "not smoke", "-v"]
    restart: "no"
    logging: *default-logging

  # 端對端冒煙測試:docker compose -f docker-compose.remote.yml --profile test run --rm smoke-test
  smoke-test:
    profiles: ["test"]
    build:
      context: ./gateway
      target: dev
    image: qwen35-stack/gateway:dev
    environment:
      GATEWAY_BASE_URL: http://gateway:8080
      SMOKE_TIMEOUT: ${SMOKE_TIMEOUT:-180}
    command: ["pytest", "-m", "smoke", "-v"]
    depends_on:
      gateway:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

volumes:
  open-webui-data:
    name: open-webui-data                        # 沿用既有 docker run 建立的 volume,避免 compose 專案前綴造成資料「消失」
